[project]
name = "regulator"
version = "0.1.0"
description = "Turns CISA SCuBA baselines and ScubaGear assessment results into validated NIST OSCAL artifacts, with AI reasoning on top."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "regex>=2024.11",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-dotenv>=1.0",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[project.scripts]
regulator = "regulator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
